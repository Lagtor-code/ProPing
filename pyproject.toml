[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proping"
version = "1.0.0"
authors = [
  { name="ProPing Team" },
]
description = "Global Cloud & Datacenter Latency Intelligence Suite"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.optional-dependencies]
fast-http = [
    "requests>=2.28.0",
    "urllib3>=1.26.0",
]

[project.scripts]
proping = "proping.cli:main"
